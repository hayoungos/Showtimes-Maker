<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나만의 상영시간표</title>
<style>
@font-face{font-family:"ChosunNM";src:url("fonts/ChosunKm.woff") format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"ChosunGu";src:url("fonts/ChosunGu.woff") format("woff");font-weight:400;font-display:swap}
/* VOICE: a quiet cinema-programme desk, precise and calm
   IDEA: the printed weekly showtime board pinned in an arthouse lobby
   PICTURE: the board itself, editable in place, exactly as it will export
   COLOUR and TYPE: paper #f4f2f2, ink #322e2e, black day bars, black primary, time badge colour chosen by the user (default #920025); 조선굵은명조 tight for titles and times, 조선굴림체 for details
   LAYOUT: thin tool bar, setup row, then the board; columns swipe on phones */
:root{color-scheme:light dark;--bg:light-dark(#e9e6e6,#141111);--ink:light-dark(#322e2e,#eeeaea);--mute:light-dark(#6f6868,#a59e9e);--line:light-dark(#d3cdcd,#3a3333);--panel:light-dark(#ffffff,#1f1a1a);--field:light-dark(#f4f2f2,#2a2424);--red:#920025;--pri:light-dark(#000,#f4f2f2);--on-pri:light-dark(#fff,#000);--badge:#920025;--badge-ink:#ffffff;--paper:#f4f2f2;--serif:"ChosunNM",serif;--sans:"ChosunGu",system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:16px max(4vw,14px) 80px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:14px}
.acts{display:flex;gap:10px}
.bar h1{font:400 22px/1.2 var(--serif);letter-spacing:-.04em;margin:0;margin-right:auto}
.stat{font-size:14px;color:var(--mute);white-space:nowrap}
.stat b{color:var(--ink);font-weight:700}
.btn{min-height:44px;padding:0 16px;border-radius:0;border:1px solid var(--line);background:var(--panel);font-size:15px;white-space:nowrap}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri);font-weight:500}
.btn.ghost{background:transparent}
.btn.danger{color:#c4123f;border-color:currentColor;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.setup{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:0;padding:14px;margin-bottom:18px}
.f{display:flex;flex-direction:column;gap:4px}
.f span{font-size:13px;color:var(--mute)}
.f input{min-height:44px;border:1px solid var(--line);border-radius:0;background:var(--field);padding:0 12px;font-size:16px;width:100%}
.sw{display:flex;gap:6px;align-items:center;min-height:44px}
.sw button{width:30px;height:30px;padding:0;border:1px solid rgba(0,0,0,.25);border-radius:0;position:relative}
.sw button[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}
.sw label{width:30px;height:30px;border:1px dashed var(--mute);display:grid;place-items:center;font-size:16px;color:var(--mute);cursor:pointer;position:relative;overflow:hidden}
.sw label.on{outline:2px solid var(--ink);outline-offset:2px;border-style:solid}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.sk{background:linear-gradient(90deg,#2a2525 25%,#423b3b 50%,#2a2525 75%) 0 0/200% 100%!important;border-color:#000}
.sk-line{display:block;height:12px;background:linear-gradient(90deg,#e6e1e1 25%,#f4f0f0 50%,#e6e1e1 75%) 0 0/200% 100%;margin:0 10px}
.sk-card{display:flex;flex-direction:column;gap:8px}.sk-card .shot{border:1.45px solid #000}
.sk-card .tb{width:52px;height:23px}.sk-card .l1{width:70%}.sk-card .l2{width:50%;height:10px}
@media(prefers-reduced-motion:no-preference){.sk,.sk-line{animation:shim 1.2s linear infinite}@keyframes shim{to{background-position:-200% 0}}}
.errbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border:1px solid #c4123f;background:#fff4f6;color:#7a0b28;padding:8px 8px 8px 14px;margin-bottom:14px;font-size:14px}
.errbar[hidden]{display:none}
.retry{min-height:36px;padding:0 12px;border:1px solid currentColor;background:transparent;color:inherit;border-radius:0;font-size:14px;white-space:nowrap}
.saveinfo .retry{margin-left:8px;color:#c4123f}
.hint{grid-column:1/-1;font-size:13px;color:var(--mute);margin:-4px 0 0}
.foot{text-align:center;word-break:keep-all;margin-top:22px;padding:18px 0 0;border-top:1px solid var(--line);color:var(--mute);font-size:14px;line-height:1.6}
.foot p{margin:0}
.saveinfo{color:var(--ink);font-weight:700;font-size:15px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:4px!important}
.foot .note{font-size:13px;margin-top:2px}
/* board */
.board{background:var(--paper);color:#322e2e;padding:clamp(18px,4vw,48px) clamp(14px,4vw,44px) clamp(24px,4vw,48px);border-radius:0;box-shadow:0 1px 0 rgba(0,0,0,.06),0 18px 40px -24px rgba(0,0,0,.35)}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px 24px;flex-wrap:wrap;margin-bottom:clamp(14px,2.4vw,30px)}
.bhead div{font:400 clamp(26px,4.6vw,52px)/1.05 var(--serif);letter-spacing:-.12em;white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,190px));gap:3px}
.col{border:1px solid #000;background:#fff;padding-bottom:30px;display:flex;flex-direction:column;gap:30px;min-height:min(1125px,140vw)}
.day{background:#000;color:#fff;height:60px;display:flex;align-items:center;justify-content:center;font:400 clamp(24px,2.8vw,34px)/1 var(--serif);letter-spacing:-.12em;margin-bottom:-30px}
.card{position:relative;display:flex;flex-direction:column;gap:8px}
.card.done .info{opacity:.5}.card.done .shot::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.5);z-index:1}.stamp{z-index:2}
.shot{position:relative;aspect-ratio:600/338;border:1.45px solid #000;background:#1d1919;overflow:hidden;display:block;width:100%;padding:0}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot.empty{background:#1d1919 repeating-linear-gradient(90deg,transparent 0 10px,#f4f2f2 10px 16px,transparent 16px 26px) top/100% 7px no-repeat}
.shot.empty::after{content:"";position:absolute;inset:auto 0 0;height:7px;background:inherit;background-position:bottom}
.shot.empty>span:not(.stamp){position:absolute;inset:0;display:grid;place-items:center;color:#b9b1b1}.shot.empty svg{width:30px;height:30px}
.stamp{position:absolute;left:50%;top:50%;width:55.8%;aspect-ratio:2.25;background:#151515;color:#fff;display:grid;place-items:center;font:400 clamp(22px,2.6vw,34px)/1 var(--serif);letter-spacing:-.12em;transform:translate(-50%,-50%) rotate(-9.84deg);pointer-events:none;opacity:1}
.info{padding:0 10px;display:flex;flex-direction:column;gap:6px;text-align:left;background:none;border:0;cursor:pointer;color:#000}
.time{align-self:flex-start;background:var(--badge);color:var(--badge-ink);font:400 23px/23px var(--serif);letter-spacing:-.12em;padding:0 calc(6px + .12em) 0 6px;height:23px;white-space:nowrap}
.t1{font-size:14.5px;line-height:16.8px;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-stroke:.35px currentColor}
.t2{font-size:13.5px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-top:-4px}
.card.done .warn{margin:-2px 10px 0;font-size:12px;color:#c4123f;font-weight:500}
.card.bad .shot{outline:2px solid #c4123f;outline-offset:2px}
.add{position:relative;width:100%;margin:0;padding:0;border:0;outline:1.45px dashed #b8b0b0;outline-offset:-1.45px;background:transparent;color:#5a5252;border-radius:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.add .ghost{visibility:hidden;display:flex;flex-direction:column;gap:8px}
.add .ghost i{display:block;aspect-ratio:600/338}
.add .ghost .info{cursor:default}
.add .lab{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.add b{font-size:22px;font-weight:400;line-height:1;color:#000}
.add small{font-size:12.5px;color:#7b7272}
.add:hover{outline-color:#000}
.mnav,.mdots{display:none}
.dn{position:absolute;top:8px;width:44px;height:44px;border:0;background:none;color:#fff;font:400 34px/1 var(--serif);display:none;place-items:center;padding:0}
.dn.prev{left:4px}.dn.next{right:4px}
.dn:disabled{opacity:.25;cursor:default}
.dn svg{width:20px;height:20px}
@media(max-width:760px){.day .dn{display:grid}}
.mdots{gap:6px;align-items:center;margin:-4px 0 12px}
.mdots button{width:28px;height:28px;padding:0;border:0;background:none;display:grid;place-items:center}
.mdots button i{display:block;width:10px;height:10px;background:#cfc8c8}
.mdots button[aria-current=true] i{background:#000;width:22px}
.mdots span{font-size:13px;color:#6f6868;margin-left:6px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,6,6,.45);display:none;z-index:20}
.scrim.on{display:block}
.sheet{position:fixed;z-index:21;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--panel);color:var(--ink);display:none;flex-direction:column;box-shadow:-20px 0 50px -20px rgba(0,0,0,.4)}
.sheet.on{display:flex}
.sh{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.sh-top{display:flex;align-items:center;gap:10px}
.sh-top h2{margin:0;margin-right:auto;font:400 20px/1.2 var(--serif);letter-spacing:-.04em}
.x{width:44px;height:44px;border-radius:0;border:0;background:var(--field);font-size:22px;line-height:1}
.tm{display:flex;align-items:center;gap:6px}
.tm input{width:96px;min-height:44px;text-align:center;font:400 20px var(--serif);border:1px solid var(--line);border-radius:0;background:var(--field);letter-spacing:-.04em}
.tm button{min-width:44px;min-height:44px;border-radius:0;border:1px solid var(--line);background:transparent;font-size:14px}
.tm label{font-size:15px;font-weight:700;color:var(--ink);margin-right:6px;white-space:nowrap}
.err{font-size:13px;color:#c4123f;min-height:0}
.search{min-height:46px;border:1px solid var(--line);border-radius:0;background:var(--field);padding:0 14px;font-size:16px;width:100%}
.list{flex:1;overflow:auto;padding:4px 8px 24px;margin:0;list-style:none}
.list li button{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;text-align:left;border:0;background:transparent;padding:10px 10px;border-radius:0;min-height:56px}
.list li button:hover,.list li button.hl{background:var(--field)}
.list .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .nm i{font-style:normal;color:var(--mute);font-weight:400}
.list .meta{grid-row:2;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .end{grid-row:1/3;grid-column:2;font:400 15px var(--serif);letter-spacing:-.03em;white-space:nowrap;text-align:right}
.list .end small{display:block;font:400 11.5px var(--sans);color:var(--mute);letter-spacing:0}
.list button:disabled{opacity:.38;cursor:not-allowed}
.empty-l{padding:24px 12px;color:var(--mute);font-size:14px}
.edit{padding:18px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.edit .shot{max-width:320px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:13px;color:var(--mute);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:40px;padding:0 12px;border-radius:0;border:1px solid var(--line);background:transparent;font-size:14px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1b1717;color:#fff;padding:10px 10px 10px 18px;border-radius:0;display:none;align-items:center;gap:12px;z-index:40;font-size:14px;max-width:calc(100% - 24px)}
.toast.on{display:flex}
.toast button{background:transparent;border:0;color:#ff8fa8;font-weight:700;min-height:36px;padding:0 10px}
.dlg{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(10,6,6,.5);padding:16px}
.dlg.on{display:grid}
.dlg>div{background:var(--panel);color:var(--ink);border-radius:0;padding:20px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:14px}
.dlg h3{margin:0;font:400 19px var(--serif)}
.dlg p{margin:0;font-size:15px;color:var(--mute)}
.dlg img{width:100%;border-radius:0;border:1px solid var(--line)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:760px){
 .setup{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .setup .f:first-child{grid-column:1/-1}
 .setup .f:nth-child(4){grid-column:1/-1}
 .bar{gap:12px}
 .bar .stat{font-size:13px}
 .acts{width:100%;gap:8px}
 .acts .btn{flex:1 1 auto;padding:0 10px;font-size:15px}
 .cols{display:block;position:relative}
 .col{display:none;min-height:0}
 .col.cur{display:flex}
 .day{position:relative}
 .mnav{display:flex}
 .mdots{display:flex}
 .bhead{flex-direction:column;gap:2px}
 .sheet{top:auto;left:0;width:100%;height:min(86vh,720px);border-radius:0}
 .stamp{font-size:30px}
}
@media(prefers-reduced-motion:no-preference){.card.new{animation:in .3s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<div class="wrap">
 <div class="bar">
  <h1>상영시간표 만들기</h1>
  <span class="stat" id="prog"></span>
  <div class="acts">
   <button class="btn ghost" id="bNew">새로 만들기</button>
   <button class="btn ghost" id="bSet">쉬는 시간 <b id="gapLbl"></b></button>
   <button class="btn pri" id="bExp">이미지 저장</button>
  </div>
 </div>
 <form class="setup" id="setup" autocomplete="off">
  <label class="f"><span>제목</span><input id="iTitle" maxlength="20"></label>
  <label class="f"><span>시작일</span><input type="date" id="iStart"></label>
  <label class="f"><span>종료일 (최대 5일)</span><input type="date" id="iEnd"></label>
  <div class="f"><span>시간 박스 색</span><div class="sw" id="sw"></div></div>
 </form>
 <section class="board" id="board" aria-label="상영시간표 미리보기">
  <div class="bhead"><div id="bTitle"></div><div id="bRange"></div></div>
  <div class="errbar" id="errbar" role="alert" hidden><span id="errMsg"></span><button class="retry" id="errRetry">다시 시도</button></div>
  <div class="mdots" id="mdots" aria-label="날짜 이동"></div>
  <div class="cols" id="cols"></div>
 </section>
 <footer class="foot">
  <p class="saveinfo" id="saveInfo" role="status">이 기기에 자동 저장돼요.</p>
  <p id="footDesc">다시 방문해 시간표를 수정하거나, 다 본 영화를 체크할 수 있어요.</p>
  <p class="note" id="footNote">저장된 내용은 다른 기기와 공유되지 않으며, 브라우저 데이터를 삭제하면 모두 사라져요 ㅠㅠ</p>
 </footer>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle"></aside>
<div class="dlg" id="dlg" role="dialog" aria-modal="true"><div id="dlgBox"></div></div>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastBtn" hidden>되돌리기</button></div>
<input type="file" accept="image/*" id="file" class="vh" tabindex="-1">

function find(q){
 q=norm(q);const all=LIST;
 if(!q)return all.slice().sort((a,b)=>a.t.localeCompare(b.t,"ko"));
 const isCho=/^[ㄱ-ㅎ]+$/.test(q);
 const sc=m=>{if(m.n.startsWith(q))return 0;if(m.n.includes(q))return 1;if(isCho&&m.c.startsWith(q))return 2;if(isCho&&m.c.includes(q))return 3;if(m.nd.includes(q)||(isCho&&m.cd.includes(q)))return 4;return 9};
 return all.map(m=>[sc(m),m]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||a[1].t.localeCompare(b[1].t,"ko")).map(x=>x[1]);
}

/* ---------- save ---------- */
let db=null,me=null,saveT=0,dirty=false;
function showErr(msg,fn){$("errMsg").textContent=msg;$("errbar").hidden=false;$("errRetry").onclick=()=>{$("errbar").hidden=true;fn()}}
function hideErr(){$("errbar").hidden=true}
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify(S));return true}catch(e){return false}}
function saveFail(msg,fn){$("saveInfo").innerHTML="";$("saveInfo").append(msg);const b=document.createElement("button");b.className="retry";b.textContent="다시 시도";b.onclick=fn;$("saveInfo").append(b)}
function changed(){S.updated=Date.now();const ok=persistLocal();render();dirty=true;clearTimeout(saveT);saveT=setTimeout(pushRemote,700);if(!ok&&!db){saveFail("저장하지 못했어요",()=>{if(persistLocal())setInfo("이 기기에 자동 저장돼요.")});return}setInfo(db?"저장 중…":"이 기기에 자동 저장돼요.")}
function setInfo(t){$("saveInfo").textContent=t;$("footNote").hidden=!!db}
const stateRef=()=>db.doc("data/users/"+me+"/schedule");
let writing=false;
async function pushRemote(){
 if(!db||!dirty)return;if(writing){saveT=setTimeout(pushRemote,500);return}
 writing=true;dirty=false;
 try{await stateRef().set(JSON.parse(JSON.stringify(S)));setInfo("내 계정에 자동 저장돼요.")}
 catch(e){writing=false;if(e&&e.code==="invalid_argument"){db=null;setInfo("이 기기에 자동 저장돼요.");return}dirty=true;saveFail("계정에 저장하지 못했어요",()=>{setInfo("저장 중…");pushRemote()});return}
 writing=false;
}
async function putImg(id,data){await idbPut(id,data);if(!db)return;try{await stateRef().collection("img").doc(id).set({d:data})}catch(e){}}
async function delImg(id){delete IMG[id];idbDel(id);if(db)try{await stateRef().collection("img").doc(id).delete()}catch(e){}}
async function initRemote(){
 if(!window.claude||!claude.use){setInfo("이 기기에 자동 저장돼요.");return}
 const timer=setTimeout(()=>setInfo("이 기기에 자동 저장돼요."),10000);
 try{
  const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
  me=u&&await u.id();
  if(!d||!me){clearTimeout(timer);setInfo("이 기기에 자동 저장돼요.");return}
  db=d;remotePending=true;render();
  let snap;try{snap=await stateRef().get()}finally{remotePending=false}clearTimeout(timer);
  if(snap.exists){const r=snap.data();if((r.updated||0)>(S.updated||0)){S=Object.assign(fresh(),JSON.parse(JSON.stringify(r)))}else if((S.updated||0)>(r.updated||0)){dirty=true;pushRemote()}}
  else if(S.entries.length||S.updated){dirty=true;pushRemote()}
  for(const e of S.entries){if(e.img&&!IMG[e.img]){try{const s=await stateRef().collection("img").doc(e.img).get();if(s.exists){IMG[e.img]=s.data().d;idbPut(e.img,IMG[e.img])}}catch(x){}}
   else if(e.img&&IMG[e.img]&&!snap.exists){putImg(e.img,IMG[e.img])}}
  persistLocal();render();setInfo("내 계정에 자동 저장돼요.");
 }catch(e){clearTimeout(timer);remotePending=false;render();if(db){showErr("계정에 저장된 시간표를 불러오지 못했어요.",()=>{db=null;initRemote()})}db=null;setInfo("이 기기에 자동 저장돼요.")}
}

/* ---------- sheet ---------- */
let mode=null,lastFocus=null;
const sheet=$("sheet");
function openSheet(html){lastFocus=document.activeElement;sheet.innerHTML=html;sheet.classList.add("on");$("scrim").classList.add("on")}
function closeSheet(){sheet.classList.remove("on");$("scrim").classList.remove("on");mode=null;if(lastFocus&&document.body.contains(lastFocus))lastFocus.focus()}
$("scrim").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("dlg").classList.contains("on"))closeDlg();else if(mode)closeSheet()}});
function parseTime(s){s=String(s).trim().replace(/[^0-9:]/g,"");let h,m;if(s.includes(":")){[h,m]=s.split(":").map(Number)}else if(s.length<=2){h=+s;m=0}else{h=+s.slice(0,-2);m=+s.slice(-2)}if(!(h>=0&&h<24&&m>=0&&m<60))return null;return h*60+m}
const timeCtl=(t,lab)=>`<div class="tm"><label for="tIn">${lab}</label><button type="button" data-st="-15">−15</button><button type="button" data-st="-5">−5</button><input id="tIn" inputmode="numeric" value="${hm(t)}" aria-label="시작 시간"><button type="button" data-st="5">+5</button><button type="button" data-st="15">+15</button></div>`;
function bindTime(on){
 const inp=$("tIn");
 sheet.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{const v=parseTime(inp.value);if(v==null)return;let n=v+ +b.dataset.st;n=Math.max(0,Math.min(1439,n));inp.value=hm(n);on(n)});
 inp.oninput=()=>{const v=parseTime(inp.value);on(v)};
 inp.onblur=()=>{const v=parseTime(inp.value);if(v!=null)inp.value=hm(v)};
}

 mode={k:rep?"rep":"add",d:rep?rep.d:d,t:rep?rep.t:Math.min(nextStart(d),1439),id:replaceId,q:"",hl:0};
 if(!rep&&nextStart(d)>=1440)mode.t=600;
 openSheet(`<div class="sh"><div class="sh-top"><h2 id="shTitle">${dayName(mode.d)} ${rep?"영화 바꾸기":"영화 추가"}</h2><button class="x" id="shX" aria-label="닫기">×</button></div>
  ${timeCtl(mode.t,"시작 시간")}<div class="err" id="tErr"></div>
  <input class="search" id="q" type="search" placeholder="제목·감독·초성으로 검색 (예: ㅇㅍㅌ)" aria-label="영화 검색" autocomplete="off"></div>
  <ul class="list" id="res" role="listbox" aria-label="검색 결과"></ul>`);

 $("q").onkeydown=e=>{const bs=[...$("res").querySelectorAll("button:not(:disabled)")];if(e.key==="ArrowDown"){e.preventDefault();mode.hl=Math.min(mode.hl+1,bs.length-1);hl(bs)}else if(e.key==="ArrowUp"){e.preventDefault();mode.hl=Math.max(mode.hl-1,0);hl(bs)}else if(e.key==="Enter"){e.preventDefault();if(bs[mode.hl])bs[mode.hl].click()}};

function hl(bs){bs.forEach((b,i)=>b.classList.toggle("hl",i===mode.hl));if(bs[mode.hl])bs[mode.hl].scrollIntoView({block:"nearest"})}
function listRes(){
 const t=mode.t,ex=mode.k==="rep"?mode.id:null;

 if(!r.length){$("res").innerHTML=`<li class="empty-l">찾는 영화가 없어요. 다른 글자로 검색해 보세요.</li>`;return}
 let firstErr="";
 $("res").innerHTML=r.map(m=>{const why=t==null?"시간 확인":check(mode.d,t,m.rt,ex);if(why&&!firstErr)firstErr=why;
  return`<li><button data-m="${m.id}" ${why?`disabled title="${esc(why)}"`:""}><span class="nm">${esc(m.t)} <i>(${m.y})</i></span><span class="meta">${m.rt}분 · ${esc(m.d)}</span><span class="end">${t==null?"":"→ "+endLabel(t,m.rt)}<small>${why?"안 들어가요":"종료"}</small></span></button></li>`}).join("");
 const allBad=r.every(m=>t==null||check(mode.d,t,m.rt,ex));

 else if(t!=null&&r.some(m=>check(mode.d,t,m.rt,ex)))$("tErr").textContent="흐린 영화는 이 시간에 넣으면 다음 영화와 겹쳐요";

function pick(mid){
 const m=M[mid];
 if(mode.k==="rep"){const e=S.entries.find(x=>x.id===mode.id);e.m=mid;e.t=mode.t;changed();toast(m.t+"(으)로 바꿨어요");closeSheet();return}
 justAdded=uid();S.entries.push({id:justAdded,d:mode.d,m:mid,t:mode.t,done:false});

 listRes();$("q").focus();

/* images */
let imgFor=null;
function pickImage(id){imgFor=id;$("file").value="";$("file").click()}
$("file").onchange=()=>{const f=$("file").files[0];if(f&&imgFor)processImage(f,imgFor)};
async function processImage(f,forId){
 imgFor=forId;uploading=forId;render();
 try{
  const url=URL.createObjectURL(f);const im=new Image();im.src=url;await im.decode();
  const W=640,H=Math.round(640*338/600),c=document.createElement("canvas");c.width=W;c.height=H;
  const x=c.getContext("2d"),r=Math.max(W/im.naturalWidth,H/im.naturalHeight),w=im.naturalWidth*r,h=im.naturalHeight*r;
  x.drawImage(im,(W-w)/2,(H-h)/2,w,h);URL.revokeObjectURL(url);
  const data=c.toDataURL("image/jpeg",.82);
  const e=S.entries.find(z=>z.id===forId);if(!e){uploading=null;render();return}
  const old=e.img;const nid=uid();IMG[nid]=data;e.img=nid;changed();await putImg(nid,data);if(old)delImg(old);
  if(mode&&mode.k==="edit"&&mode.id===e.id)openEdit(e.id);
  uploading=null;render();toast("스틸컷을 넣었어요");
 }catch(err){uploading=null;render();toast("이미지를 넣지 못했어요",()=>processImage(f,forId),"다시 시도")}
}

$("setup").onsubmit=e=>e.preventDefault();
let titleT=0;
$("iTitle").oninput=e=>{S.title=e.target.value;$("bTitle").textContent=S.title||"제목";clearTimeout(titleT);titleT=setTimeout(changed,500)};
$("iStart").onchange=e=>{if(!e.target.value)return;S.start=e.target.value;changed()};
$("iEnd").onchange=e=>{
 if(!e.target.value)return;
 let n=Math.round((new Date(e.target.value+"T00:00:00")-new Date(S.start+"T00:00:00"))/864e5)+1;
 if(n<1){toast("종료일은 시작일 이후여야 해요");render();return}
 if(n>5){n=5;toast("기간은 최대 5일이에요")}
 const lost=S.entries.filter(x=>x.d>=n);
 if(lost.length){dialog("기간 줄이기",`빠지는 날짜에 있는 영화 ${lost.length}편도 함께 지워져요.`,"줄이기",()=>{S.entries=S.entries.filter(x=>x.d<n);S.days=n;changed()},render);return}
 S.days=n;changed();
};

/* dialog */
let dlgCancel=null;
function dialog(t,p,ok,onOk,onCancel,extra){
 dlgCancel=onCancel||null;
 $("dlgBox").innerHTML=`<h3>${t}</h3><p>${p}</p>${extra||""}<div class="row" style="justify-content:flex-end"><button class="btn ghost" id="dNo">${ok?"취소":"닫기"}</button>${ok?`<button class="btn pri" id="dOk">${ok}</button>`:""}</div>`;
 $("dlg").classList.add("on");
 $("dNo").onclick=closeDlg;if(ok)$("dOk").onclick=()=>{$("dlg").classList.remove("on");onOk()};
 ($("dOk")||$("dNo")).focus();
}
function closeDlg(){$("dlg").classList.remove("on");if(dlgCancel)dlgCancel();dlgCancel=null}

$("bNew").onclick=()=>{
 const go=()=>{const prev=JSON.parse(JSON.stringify(S));const keep={gap:S.gap,badge:S.badge};S=Object.assign(fresh(),keep);closeSheet();changed();
  toast("새 시간표를 시작했어요",()=>{S=prev;changed()})};
 if(!S.entries.length){go();return}
 dialog("새로 만들기",`지금 시간표의 영화 ${S.entries.length}편이 지워져요.<br>쉬는 시간과 시간 박스 색은 그대로 유지돼요.`,"새로 만들기",go);
};
$("bSet").onclick=()=>{
 dialog("쉬는 시간","영화가 끝나는 시간과 다음 영화 시작 시간이<br>겹치지 않게 비워 두는 시간이에요.","적용",()=>{const v=parseInt($("gapIn").value,10);if(v>=0&&v<=180){S.gap=v;changed();toast("쉬는 시간 "+v+"분")}else toast("0~180분 사이로 입력하세요")},null,
 `<label class="f"><span>분</span><input id="gapIn" type="number" min="0" max="180" step="5" inputmode="numeric" value="${S.gap}"></label>`);
 setTimeout(()=>$("gapIn").select(),0);
};

/* ---------- export ---------- */
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
function fitText(x,s,max){if(x.measureText(s).width<=max)return s;while(s.length>1&&x.measureText(s+"…").width>max)s=s.slice(0,-1);return s+"…"}
function wrap(x,s,max,maxLines){const words=s.split(" "),out=[];let cur="";
 const push=w=>{if(x.measureText(w).width<=max)return w;let part="";for(const ch of w){if(x.measureText(part+ch).width>max){out.push(part);part=ch}else part+=ch}return part};
 for(const wd of words){const tryS=cur?cur+" "+wd:wd;if(x.measureText(tryS).width<=max)cur=tryS;else{if(cur)out.push(cur);cur=push(wd)}}
 if(cur)out.push(cur);
 if(out.length>maxLines){const keep=out.slice(0,maxLines);keep[maxLines-1]=fitText(x,out.slice(maxLines-1).join(" "),max);return keep}
 return out}
function ls(x,v){try{x.letterSpacing=v}catch(e){}}
async function drawPoster(){
 const W=1080,H=1350,sc=2,c=document.createElement("canvas");c.width=W*sc;c.height=H*sc;
 const x=c.getContext("2d");x.scale(sc,sc);
 const texts=S.title+rangeText()+Array.from({length:S.days},(_,d)=>dayName(d)).join("")+"0123456789:Done()~월일…";
 const body=S.entries.map(e=>M[e.m].t+M[e.m].d).join("")+"분·0123456789()…";
 await Promise.all([document.fonts.load('400 52px "ChosunNM", serif',texts),document.fonts.load('400 14px "ChosunGu", sans-serif',body)]).catch(()=>{});
 x.fillStyle="#f4f2f2";x.fillRect(0,0,W,H);
 x.fillStyle="#322e2e";x.font='400 52px "ChosunNM", serif';ls(x,"-6.25px");x.textBaseline="top";
 x.textAlign="left";x.fillText(S.title||"제목",56.67,60);x.textAlign="right";x.fillText(rangeText(),1022.24,60);
 const X=[60,253,445,638,830],CW=[190,189,190,189,190],top=147,imgH=106.4,LH=16.8,base=176.73;
 x.font='400 14.46px "ChosunGu", sans-serif';ls(x,"0px");
 const lay=[];let colH=1125.66;
 for(let d=0;d<S.days;d++){const L=dayList(d).map(e=>{const m=M[e.m];const lines=wrap(x,m.t+" ("+m.y+")",CW[d]-20,2);return{e,m,lines,h:base+(lines.length-1)*LH}});lay.push(L);
  const need=60+L.reduce((s,c)=>s+c.h,0)+30*Math.max(0,L.length-1)+60;if(need>colH)colH=need}
 colH=Math.min(colH,H-top-20);
 for(let d=0;d<S.days;d++){
  const cx=X[d],w=CW[d];
  x.fillStyle="#fff";x.fillRect(cx,top,w,colH);
  x.fillStyle="#000";x.fillRect(cx,top,w,60);
  x.fillStyle="#fff";x.font='400 34.7px "ChosunNM", serif';ls(x,"-4.16px");x.textAlign="center";x.textBaseline="middle";x.fillText(dayName(d),cx+w/2,top+31);
  let y=top+60;
  for(const {e,m,lines,h} of lay[d]){
   const src=e.img&&IMG[e.img],im=src&&await loadImg(src);
   if(im){const r=Math.max(w/im.width,imgH/im.height),iw=im.width*r,ih=im.height*r;x.save();x.beginPath();x.rect(cx,y,w,imgH);x.clip();x.drawImage(im,cx+(w-iw)/2,y+(imgH-ih)/2,iw,ih);x.restore()}
   else{x.fillStyle="#1d1919";x.fillRect(cx,y,w,imgH);x.fillStyle="#f4f2f2";for(let p=cx+10;p<cx+w-6;p+=26){x.fillRect(p,y+1,6,5);x.fillRect(p,y+imgH-6,6,5)}}
   if(e.done){x.fillStyle="rgba(255,255,255,.5)";x.fillRect(cx,y,w,imgH)}
   x.strokeStyle="#000";x.lineWidth=1.446;x.strokeRect(cx+.72,y+.72,w-1.45,imgH-1.45);
   x.globalAlpha=e.done?.5:1;
   const iy=y+imgH+8;
   x.font='400 23.1px "ChosunNM", serif';ls(x,"-2.78px");x.textAlign="left";x.textBaseline="alphabetic";
   const tm=x.measureText(hm(e.t)),gw=tm.actualBoundingBoxLeft+tm.actualBoundingBoxRight,bw=Math.max(52.05,gw+12);
   x.fillStyle=badge();x.fillRect(cx+10,iy,bw,23.1);
   const gh=tm.actualBoundingBoxAscent+tm.actualBoundingBoxDescent;
   x.fillStyle=badgeInk(badge());x.fillText(hm(e.t),cx+10+(bw-gw)/2+tm.actualBoundingBoxLeft,iy+(23.1-gh)/2+tm.actualBoundingBoxAscent);
   x.fillStyle="#000";x.strokeStyle="#000";x.textBaseline="top";ls(x,"0px");
   x.font='400 14.46px "ChosunGu", sans-serif';x.lineWidth=.6;x.lineJoin="round";
   lines.forEach((s,i)=>{x.strokeText(s,cx+10,iy+23.1+6+i*LH);x.fillText(s,cx+10,iy+23.1+6+i*LH)});
   x.font='400 13.46px "ChosunGu", sans-serif';x.fillText(fitText(x,m.rt+"분 · "+m.d,w-20),cx+10,iy+23.1+6+lines.length*LH+2);
   x.globalAlpha=1;
   if(e.done){x.save();x.translate(cx+w/2,y+imgH/2);x.rotate(-9.84*Math.PI/180);x.fillStyle="#151515";x.fillRect(-52.5,-21.5,105,43);x.fillStyle="#fff";x.font='400 34.7px "ChosunNM", serif';ls(x,"-4.16px");x.textAlign="left";x.textBaseline="alphabetic";const dm=x.measureText("Done"),dw=dm.actualBoundingBoxLeft+dm.actualBoundingBoxRight,dh=dm.actualBoundingBoxAscent+dm.actualBoundingBoxDescent;x.fillText("Done",-dw/2+dm.actualBoundingBoxLeft,-dh/2+dm.actualBoundingBoxAscent);x.restore()}
   y+=h+30;
  }
  x.strokeStyle="#000";x.lineWidth=1;x.strokeRect(cx+.5,top+.5,w-1,colH-1);
 }
 return c;
}
$("bExp").onclick=async()=>{
 const b=$("bExp");if(b.getAttribute("aria-busy")==="true")return;b.disabled=true;b.setAttribute("aria-busy","true");b.textContent="만드는 중…";
 try{
  const c=await drawPoster();
  const blob=await new Promise(r=>c.toBlob(r,"image/png"));
  const name=(S.title||"상영시간표").replace(/[\\/:*?"<>|]/g,"")+"_"+S.start+".png";
  let dl=null;try{dl=window.claude&&await claude.use("downloads")}catch(e){}
  let ok=false;
  if(dl){try{await dl.save({filename:name,data:blob});ok=true;toast("이미지를 저장했어요")}catch(e){if(e&&e.code==="declined"){ok=true}}}
  if(!ok&&!window.claude){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);ok=true;toast("이미지를 저장했어요")}
  if(!ok){const u=c.toDataURL("image/png");dialog("이미지 저장","이미지를 길게 누르거나 오른쪽 클릭해서 저장하세요.","",null,null,`<img src="${u}" alt="상영시간표 이미지">`)}
 }catch(e){toast("이미지를 만들지 못했어요",()=>$("bExp").click(),"다시 시도")}
 b.disabled=!S.entries.length;b.removeAttribute("aria-busy");b.textContent="이미지 저장";
};

render();
loadSheet();

loadImages();
setInfo("이 기기에 자동 저장돼요.");
initRemote();
}
